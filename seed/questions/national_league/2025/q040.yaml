stem: 对以下关于哺乳动物心脏结构的陈述进行正误判断：
options:
  A: '房室瓣（三尖瓣和二尖瓣）的开放与关闭是被动的，其状态主要取决于心房和心室之间的压力梯度，以此

    确保血流沿正确方向流动'
  B: 左心室壁比右心室壁显著增厚，反映了体循环相较于肺循环具有更高的外周血管阻力和更长的输送距离
  C: '心室舒张期是心室血液充盈的关键阶段，此时房室瓣打开，同时动脉瓣（主动脉瓣和肺动脉瓣）也需保持

    开放，以便动脉血压推动血液回流'
  D: '心脏自身的血液供应（冠状循环）对维持其持续泵血活动至关重要，其血流量会响应心肌代谢活动的变化

    而动态调整'
