source_question_no: 21
question_type: SINGLE_CHOICE
stem: 两种远缘植物在干旱环境中都演化出厚角质层，这种相似性最可能体现什么？
options:
  A: 趋同适应，不能单凭这一性状判断近缘
  B: 二者必定属于同一种
  C: 环境直接产生了所有适应性突变
  D: 二者没有共同祖先
answer:
- A
explanation: 相似选择压力可能导致远缘类群出现相似适应性特征，需要更多性状或分子证据判断亲缘。
