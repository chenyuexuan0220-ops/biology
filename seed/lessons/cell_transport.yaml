- code: cell-transport:BIO.CELL.001:INTRO
  unit_code: cell-transport
  unit_title: 细胞与物质运输
  sequence: 1
  knowledge_code: BIO.CELL.001
  tier: INTRO
  min_level: 0
  max_level: 1
  version: 1
  document:
    title: 细胞：入门理解
    summary: 围绕细胞，通过结构图、例题和检测，完成从概念到证据的入门理解学习。
    objectives:
    - 说出细胞膜、细胞质与遗传物质的基本作用
    - 区分单细胞生物、多细胞生物与病毒
    estimated_minutes: 20
    prerequisites: []
    sections:
    - id: s1
      title: 从一个生物到一个细胞
      text: 洋葱表皮、叶片和皮肤都由许多细胞组成，细菌则可以由一个细胞完成生命活动。细胞不是一个静止的小盒子：它不断进行物质交换和化学反应。观察显微图像时，先确定放大倍数和尺度，再区分直接看见的轮廓与根据知识推测的结构。
    - id: s2
      title: 边界、内部与信息
      text: 细胞膜形成细胞边界，帮助维持内部环境；细胞质是许多生命活动发生的场所；遗传物质携带构建和维持细胞所需的信息。在常见动物或植物真核细胞中，主要遗传物质位于细胞核。植物细胞外还有细胞壁，它与细胞膜不是同一结构。
    - id: s3
      title: 一个细胞，也可以生活
      text: 草履虫等单细胞生物能够摄取营养、排出物质并繁殖。多细胞生物不同细胞之间会分工协作，不能认为每个细胞都能独立生活。病毒虽然具有遗传物质，却没有完整细胞结构，也不能脱离宿主细胞独立复制。用一个例子检验自己的定义，比只背一句话更可靠。
    diagram:
      kind: CELL
      labels: &id001
      - 细胞膜
      - 细胞质
      - 细胞核
      caption: 以动物真核细胞为例的结构示意，不按比例绘制；原核细胞没有被核膜包围的细胞核。
    examples:
    - prompt: 细菌没有被核膜包围的细胞核，为什么仍然是细胞？
      reasoning: 判断细胞不能只看有没有细胞核。细菌有细胞膜、细胞质和遗传物质，并能进行生命活动，因此属于原核细胞。把某一类细胞的特点当成所有细胞的必要条件，会造成误判。
    misconceptions:
    - claim: 所有生物都由细胞构成。
      correction: 细胞是细胞生物的基本结构和功能单位；病毒没有细胞结构，复制依赖宿主细胞。
    - claim: 所有细胞都有细胞核。
      correction: 真核细胞通常具有细胞核，但原核细胞没有核膜包围的细胞核，哺乳动物成熟红细胞也没有细胞核。
    checks:
    - id: q1
      stem: 细胞与外界之间的主要边界是什么？
      options:
        A: 细胞膜
        B: 细胞核
        C: 染色体
        D: 核糖体
      answer: A
      explanation: 细胞膜包围细胞内部，参与物质交换并维持内部环境。细胞核不是整个细胞的边界。
      cognitive_level: 0
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s1
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q2
      stem: 下列哪个对象没有细胞结构？
      options:
        A: 酵母菌
        B: 大肠杆菌
        C: 流感病毒
        D: 草履虫
      answer: C
      explanation: 流感病毒不具有细胞结构，复制依赖宿主；其余对象都属于细胞生物。
      cognitive_level: 1
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s2
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q3
      stem: 单细胞生物能够生长和繁殖，最直接说明什么？
      options:
        A: 细胞都是动物
        B: 一个细胞可以完成生命活动
        C: 细胞不需要物质交换
        D: 细胞一定有叶绿体
      answer: B
      explanation: 单细胞生物以一个细胞完成生命活动，这不意味着所有细胞都有叶绿体或无需物质交换。
      cognitive_level: 0
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q4
      stem: 关于细胞核，正确的说法是？
      options:
        A: 所有细胞都有细胞核
        B: 细菌没有遗传物质
        C: 没有细胞核就不是细胞
        D: 原核细胞没有核膜包围的细胞核
      answer: D
      explanation: 原核细胞没有核膜包围的细胞核，但仍有遗传物质，不能以细胞核作为所有细胞的判据。
      cognitive_level: 1
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    pass_ratio: 0.8
    adaptations:
      junior: 先用身边可观察的例子描述细胞，再对照图示把结构、现象和解释连起来。遇到公式先说清每个量的意思，按步骤推理。
      senior: 围绕细胞明确变量、驱动力和模型边界；区分事实与机制解释，写出每个结论成立的条件，并设计能区分不同解释的证据。
    sources:
    - OpenStax Biology 2e，第 4 章 Cell Structure、第 5 章 Structure and Function of Plasma
      Membranes；https://openstax.org/details/books/biology-2e
    - 本项目原创分层讲解与检测；待人工核对，非官方竞赛试题。
- code: cell-transport:BIO.CELL.001:APPLICATION
  unit_code: cell-transport
  unit_title: 细胞与物质运输
  sequence: 1
  knowledge_code: BIO.CELL.001
  tier: APPLICATION
  min_level: 2
  max_level: 3
  version: 1
  document:
    title: 细胞：情境应用
    summary: 围绕细胞，通过结构图、例题和检测，完成从概念到证据的情境应用学习。
    objectives:
    - 用结构证据区分细胞类型
    - 用表面积与体积解释细胞交换的限制
    estimated_minutes: 30
    prerequisites: []
    sections:
    - id: s1
      title: 用多项证据分类
      text: 仅看一张切片中的圆形区域，不能立刻认定它是细胞核。要结合染色、尺度、连续切片与其他结构判断。真核细胞具有膜包围的细胞核和细胞器，原核细胞具有遗传物质和核糖体但没有核膜。植物细胞与动物细胞都是真核细胞；不是所有植物细胞都含叶绿体。
    - id: s2
      title: 大小与交换效率
      text: 把细胞近似为边长为 a 的立方体，表面积为 6a²，体积为 a³，表面积与体积之比为 6/a。边长变为两倍时，表面积变为四倍，体积变为八倍，比值减半。这个模型说明体积增长可能让单位体积可用的交换面积减少，但不能据此认定细胞一定是立方体。
    - id: s3
      title: 结构变化必须结合功能
      text: 小肠吸收细胞具有微绒毛，可以增加接触面积。哺乳动物成熟红细胞缺少细胞核，其形态和结构与运输气体有关。解释这些现象时，要说明结构怎样影响过程，并承认一个结构可能具有多种作用；不能把观察到的相关性直接写成唯一原因。
    diagram:
      kind: CELL
      labels: *id001
      caption: 以动物真核细胞为例的结构示意，不按比例绘制；原核细胞没有被核膜包围的细胞核。
    examples:
    - prompt: 立方体细胞的边长由 1 变为 2，表面积与体积之比如何变化？
      reasoning: 原先表面积与体积之比是 6/1=6，后来是 6/2=3，因此减半。分别计算面积和体积，避免把长度翻倍误当成面积或体积也只翻倍。
    misconceptions:
    - claim: 所有生物都由细胞构成。
      correction: 细胞是细胞生物的基本结构和功能单位；病毒没有细胞结构，复制依赖宿主细胞。
    - claim: 所有细胞都有细胞核。
      correction: 真核细胞通常具有细胞核，但原核细胞没有核膜包围的细胞核，哺乳动物成熟红细胞也没有细胞核。
    checks:
    - id: q1
      stem: 立方体边长翻倍时，表面积与体积之比变为原来的多少？
      options:
        A: 2 倍
        B: 4 倍
        C: 1/2
        D: 不变
      answer: C
      explanation: 表面积增加到四倍而体积增加到八倍，因此二者之比变为原来的一半。
      cognitive_level: 2
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s1
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q2
      stem: 根部细胞通常没有叶绿体，这能否否定它属于植物细胞？
      options:
        A: 能，所有植物细胞都有叶绿体
        B: 不能，不同植物细胞存在功能分工
        C: 能，因为根不是植物的一部分
        D: 不能，因为叶绿体与细胞无关
      answer: B
      explanation: 叶绿体与光合作用有关，不同植物组织的细胞结构存在分工；没有叶绿体不能直接排除植物细胞。
      cognitive_level: 3
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s2
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q3
      stem: 微绒毛对物质吸收的主要贡献是什么？
      options:
        A: 增加细胞接触面积
        B: 使细胞没有细胞膜
        C: 消除所有浓度差
        D: 直接提供遗传信息
      answer: A
      explanation: 微绒毛增大细胞表面可接触的面积，可以有利于物质交换，但并不消除细胞膜或浓度差。
      cognitive_level: 2
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q4
      stem: 观察不到细胞核时，最稳妥的做法是什么？
      options:
        A: 直接认定不是细胞
        B: 直接认定为病毒
        C: 直接认定已死亡
        D: 结合细胞膜、遗传物质和观察方法进一步判断
      answer: D
      explanation: 未观察到不等于不存在，也可能由细胞类型或观察方法造成，需要综合证据。
      cognitive_level: 3
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    pass_ratio: 0.8
    adaptations:
      junior: 先用身边可观察的例子描述细胞，再对照图示把结构、现象和解释连起来。遇到公式先说清每个量的意思，按步骤推理。
      senior: 围绕细胞明确变量、驱动力和模型边界；区分事实与机制解释，写出每个结论成立的条件，并设计能区分不同解释的证据。
    sources:
    - OpenStax Biology 2e，第 4 章 Cell Structure、第 5 章 Structure and Function of Plasma
      Membranes；https://openstax.org/details/books/biology-2e
    - 本项目原创分层讲解与检测；待人工核对，非官方竞赛试题。
- code: cell-transport:BIO.CELL.001:COMPETITION
  unit_code: cell-transport
  unit_title: 细胞与物质运输
  sequence: 1
  knowledge_code: BIO.CELL.001
  tier: COMPETITION
  min_level: 4
  max_level: 7
  version: 1
  document:
    title: 细胞：竞赛推理
    summary: 围绕细胞，通过结构图、例题和检测，完成从概念到证据的竞赛推理学习。
    objectives:
    - 评价细胞结构与功能研究的因果证据
    - 区分测量信号、细胞数量与机制解释
    estimated_minutes: 40
    prerequisites: []
    sections:
    - id: s1
      title: 从结构描述到可检验机制
      text: 观察到某细胞器增多和代谢增强同时发生，只能提出相关关系。要支持因果机制，可以干预相关结构或蛋白，测量特定功能，设置载体、溶剂与活性对照，并在可能时进行回补。回补恢复表型增强因果解释，但也不能自动排除所有非特异效应。
    - id: s2
      title: 数量、总量与归一化
      text: 同样体积的两份培养物，如果细胞数量不同，总蛋白量或总荧光就不能直接代表单个细胞的功能差异。根据问题选择按活细胞数、总蛋白或细胞体积归一化，并报告分布与重复。平均值相同也不意味着每个细胞相同，群体异质性可能被平均掩盖。
    - id: s3
      title: 干预后的下降意味着什么
      text: 抑制线粒体 ATP 合成后主动运输下降，支持运输依赖能量供应的可能，但也可能伴随细胞损伤。应同时测 ATP、细胞活性和膜完整性，并使用不同干预或补救实验。严谨结论要区分观察事实、机制假设和仍未排除的解释。
    diagram:
      kind: CELL
      labels: *id001
      caption: 以动物真核细胞为例的结构示意，不按比例绘制；原核细胞没有被核膜包围的细胞核。
    examples:
    - prompt: 药物处理后细胞总荧光减半，能否直接认为每个细胞的目标蛋白量减半？
      reasoning: 不能。若处理使存活细胞数量减半而单细胞信号不变，也会得到总荧光减半。需要计数、测活性，并比较单细胞或合适归一化后的信号，再判断表达量变化。
    misconceptions:
    - claim: 所有生物都由细胞构成。
      correction: 细胞是细胞生物的基本结构和功能单位；病毒没有细胞结构，复制依赖宿主细胞。
    - claim: 所有细胞都有细胞核。
      correction: 真核细胞通常具有细胞核，但原核细胞没有核膜包围的细胞核，哺乳动物成熟红细胞也没有细胞核。
    checks:
    - id: q1
      stem: 处理后总荧光减半，存活细胞数也减半，首先应如何解读？
      options:
        A: 单细胞表达量必然减半
        B: 总量变化可能由细胞数变化解释
        C: 证明目标蛋白被完全降解
        D: 无需任何归一化
      answer: B
      explanation: 总信号由数量和单细胞信号共同决定；存活细胞减少可能解释总量下降，应进一步归一化。
      cognitive_level: 3
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s1
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q2
      stem: 哪组证据更能支持目标蛋白参与某细胞功能？
      options:
        A: 表达量与功能相关
        B: 单次显微照片
        C: 敲除产生缺陷且回补恢复，并有适当对照
        D: 只观察到细胞变大
      answer: C
      explanation: 干预、回补和对照能增强因果证据，而单纯相关或一次照片不足以确认功能。
      cognitive_level: 4
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s2
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q3
      stem: 两组细胞的平均信号相同，能推出什么？
      options:
        A: 每个细胞都相同
        B: 两组分布必定相同
        C: 细胞类型必定相同
        D: 均值相同，但异质性仍可能不同
      answer: D
      explanation: 平均值无法完整描述分布，两组可能具有不同变异或亚群，需要单细胞数据。
      cognitive_level: 3
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q4
      stem: ATP 合成抑制剂降低运输速率，最重要的补充控制之一是？
      options:
        A: 测定细胞活性与膜完整性
        B: 只增加图片亮度
        C: 删除所有低信号细胞
        D: 取消溶剂对照
      answer: A
      explanation: 应排除细胞死亡或膜破坏造成的非特异影响，同时验证能量变化和运输变化。
      cognitive_level: 4
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: TRANSFER
    pass_ratio: 0.8
    adaptations:
      junior: 先用身边可观察的例子描述细胞，再对照图示把结构、现象和解释连起来。遇到公式先说清每个量的意思，按步骤推理。
      senior: 围绕细胞明确变量、驱动力和模型边界；区分事实与机制解释，写出每个结论成立的条件，并设计能区分不同解释的证据。
    sources:
    - OpenStax Biology 2e，第 4 章 Cell Structure、第 5 章 Structure and Function of Plasma
      Membranes；https://openstax.org/details/books/biology-2e
    - 本项目原创分层讲解与检测；待人工核对，非官方竞赛试题。
- code: cell-transport:BIO.CELL.004:INTRO
  unit_code: cell-transport
  unit_title: 细胞与物质运输
  sequence: 2
  knowledge_code: BIO.CELL.004
  tier: INTRO
  min_level: 0
  max_level: 1
  version: 1
  document:
    title: 细胞膜：入门理解
    summary: 围绕细胞膜，通过结构图、例题和检测，完成从概念到证据的入门理解学习。
    objectives:
    - 解释细胞膜的边界与交换作用
    - 区分选择透过与完全封闭
    estimated_minutes: 20
    prerequisites:
    - BIO.CELL.001
    sections:
    - id: s1
      title: 边界也要交换
      text: 细胞要摄取原料并排出部分产物，因此边界不能完全封闭。细胞膜把内部环境与外界分开，又允许特定物质通过。把细胞膜比作有规则的边界有助于理解，但膜没有人的意图；分子能否通过由结构、物理性质和相应运输机制共同决定。
    - id: s2
      title: 膜由什么构成
      text: 细胞膜的基本骨架是磷脂双层，其中分布着许多蛋白质。磷脂与水的相互作用使其形成双层结构。部分膜蛋白形成通路，部分参与识别或信号接收。此图是为了突出结构关系的模型，实际膜不是整齐、静止而且处处完全一样的排列。
    - id: s3
      title: 选择透过性
      text: 氧气等小的非极性分子较容易通过脂质部分；离子带电，直接穿过脂质内部较困难，通常需要相应通路。水也能够通过膜，许多细胞含有水通道蛋白。某种物质能通过，并不能说明所有物质都能同样快地通过。
    diagram:
      kind: MEMBRANE
      labels: &id002
      - 细胞外
      - 磷脂双层
      - 膜蛋白
      - 细胞内
      caption: 膜的简化截面：磷脂构成双层，蛋白参与多种功能；不是所有分子都走同一种通路。
    examples:
    - prompt: 氧气能进入细胞，是否说明钠离子也能同样容易地穿过脂质双层？
      reasoning: 不能。氧气和钠离子的性质不同，钠离子带电，其跨膜往往依赖相应的蛋白通路。应先比较物质性质，再讨论膜的通透性，不能仅凭一种物质推广到所有物质。
    misconceptions:
    - claim: 细胞膜是一堵完全不透水的墙。
      correction: 细胞膜具有选择透过性，水和一些物质可以通过。通透性与分子性质、膜组成及通道有关。
    - claim: 只有需要能量的过程才能经过膜蛋白。
      correction: 膜蛋白也参与被动运输，例如通道或载体介导的易化扩散；有蛋白参与不等于主动运输。
    checks:
    - id: q1
      stem: 细胞膜的选择透过性意味着什么？
      options:
        A: 所有物质都不能通过
        B: 所有物质一样容易通过
        C: 不同物质的通过能力不同
        D: 只有固体能通过
      answer: C
      explanation: 不同物质因性质及运输通路不同而具有不同通过能力，选择透过不等于完全封闭。
      cognitive_level: 0
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s1
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q2
      stem: 细胞膜的基本骨架通常是什么？
      options:
        A: 磷脂双层
        B: 纤维素厚墙
        C: DNA 双链
        D: 淀粉层
      answer: A
      explanation: 细胞膜的基本骨架是磷脂双层，膜蛋白参与运输、信号等功能；纤维素主要与植物细胞壁有关。
      cognitive_level: 1
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s2
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q3
      stem: 哪个说法正确描述水与细胞膜？
      options:
        A: 水永远不能通过膜
        B: 水只能在膜外存在
        C: 水能通过说明离子同样自由通过
        D: 水能够通过，许多细胞还有水通道蛋白
      answer: D
      explanation: 水可以跨膜，许多细胞具有水通道蛋白；水通透性不能用于推断其他物质的通透性。
      cognitive_level: 0
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: q4
      stem: 关于膜蛋白，哪个说法正确？
      options:
        A: 只负责支撑细胞壁
        B: 可以参与物质运输和信号接收
        C: 存在就说明物质一定逆梯度运输
        D: 所有蛋白作用完全相同
      answer: B
      explanation: 膜蛋白具有运输、受体等不同作用，有蛋白参与并不意味着一定是主动运输。
      cognitive_level: 1
      competency_code: MECHANISM_REASONING
      revisit_section: s3
      prerequisite_code: null
      evidence_kind: STANDARD
    - id: prerequisite
      stem: 前置概念核对：下列哪个对象没有细胞结构？
      options:
        A: 酵母菌
        B: 大肠杆菌
        C: 流感病毒
        D: 草履虫
      answer: C
      explanation: 流感病毒不具有细胞结构，复制依赖宿主；其余对象都属于细胞生物。
      cognitive_level: 1
      competency_code: KNOWLEDGE_UNDERSTANDING
      revisit_section: s1
      prerequisite_code: BIO.CELL.001
      evidence_kind: STANDARD
    pass_ratio: 0.8
    adaptations:
      junior: 先用身边可观察的例子描述细胞膜，再对照图示把结构、现象和解释连起来。遇到公式先说清每个量的意思，按步骤推理。
      senior: 围绕细胞膜明确变量、驱动力和模型边界；区分事实与机制解释，写出每个结论成立的条件，并设计能区分不同解释的证据。
    sources:
    - OpenStax Biology 2e，第 4 章 Cell Structure、第 5 章 Structure and Function of Plasma
