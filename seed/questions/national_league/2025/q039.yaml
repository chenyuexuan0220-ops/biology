source_question_no: 39
question_type: COMPREHENSIVE
stem: '有同一个属的四个物种（甲, 乙, 丙, 丁），基于基因组序列构建的物种树如a 图所示，研究者用四个物种的

  X 基因序列也构建了一棵基因树（b 图），发现物种树与X 基因树

  的拓扑结构存在差异。对以下关于此现象原因或相关原理的陈述进

  行正误判断：'
options:
  A: '在物种丙和物种丁分化后，物种甲和物种丙发生了杂交。对于

    X 基因，物种甲的等位基因通过基因流进入了物种丙，并替代了其

    原有的等位基因，导致X 基因的系统树与物种树不一致'
  B: '在四个物种的共同祖先中，X 基因发生了复制，形成X1 和X2

    两个旁系同源基因。伴随物种分化过程，在物种甲和物种丙中保留

    了基因X1，在物种乙和物种丁中保留了基因X2，并各自积累了新的变异，导致基于现存X 基因构建的系统树

    与物种树不一致'
  C: '物种甲与乙、丙、丁的共同祖先分化后，物种乙、丙、丁很快也完成了分化。在此过程中，由于X 基因的

    不完全谱系分选，导致其系统树与物种树不一致'
  D: '当X 基因是动物的线粒体基因时，由于其通常较低的有效群体大小和缺乏重组，相比于典型的核基因，更

    不容易因为不完全谱系分选导致基因树与物种树不一致'
