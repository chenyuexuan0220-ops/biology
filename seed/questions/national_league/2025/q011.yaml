  raw_text: "右图展示了利用酵母提取物进行葡萄糖酒精发酵时，通过监测二氧化碳\n(CO2)释放量来追踪发酵进程的实验结果，图中还包含了添加可溶性磷酸盐（以\n\
    提供无机磷酸，Pi）对发酵速率影响的信息。对以下关于该实验及相关代谢过\n程的陈述进行正误判断：\n A. 由于二氧化碳是酵母酒精发酵的化学计量产物，因此监测其释放量可用\n\
    于追踪发酵进程\n B. 在糖酵解途径中，无机磷酸(Pi)是丙酮酸激酶催化反应的直接底物之一\n C. 若实验观察到添加无机磷酸(Pi)能显著提高CO2 释放速率，则表明初始酵\n\
    母提取物中的Pi 浓度是限制发酵速率的因素之一\n D. 酵母酒精发酵过程中，每产生1 摩尔的二氧化碳(CO2)，必然伴随着1 摩\n尔无机磷酸(Pi)的净消耗\n\
    题干12-13. 为了检测SPR1 蛋白的稳定性，分别使用环己亚胺（CHX）和/或 MG132 处理拟南芥幼苗16 小时\n后，分别提取总蛋白进行免疫印迹分析。CHX\
    \ 是蛋白质合成抑制剂，MG132 是蛋白酶体抑制剂。实验结果如右\n图所示，尝试回答以下问题。"
