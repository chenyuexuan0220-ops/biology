    为野生型对照，er105 是缺失ER 功能的突变体，gER/er105

    是在er105 中转入了ERpro:ER-4myc 载体，在该载体中由

    ER 基因自身启动子驱动ER 与Myc 标签序列的融合基因，

    共获得三个独立转基因株系。'
