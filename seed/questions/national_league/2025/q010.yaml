stem: 对以下关于细胞中的信号分子的描述进行正误判断：
options:
  A: 第二信使不包含蛋白质，其通过胞内浓度变化来应答胞外信号，参与调控信号转导过程
  B: 蛋白激酶和磷酸酶介导的蛋白质磷酸化和去磷酸化是细胞信号转导的一种“分子开关”机制
  C: '在缺氧条件下，亲水性信号分子可通过特异性通道蛋白如水孔变体直接进入细胞，并优先激活细胞内信号通

    路，而不依赖传统的受体–效应器级联'
  D: 气体类信号分子可以通过自由扩散进入细胞
