stem: '华北落叶松的学名被确定为 Larix gmelinii var. principis-rupprechtii (Mayr) Pilger。对以下关于该学名构成及相

  关国际植物命名法规的陈述进行正误判断：'
options:
  A: '按照命名规则，变种加词 ''principis-rupprechtii'' 在物种 Larix gmelinii 内必须是唯一的，但该加词允许与同

    属或其他属中某个物种的种加词完全相同'
  B: '变种加词 ''principis-rupprechtii'' 是构成此完整变种学名的三个主要组成部分之一，并且其分类学等级等同于

    种加词 ''gmelinii''全'
  C: '若未来研究将此变种提升至物种等级，命名法规允许在满足优先权等条件下，将原变种加词  ''principis-

    rupprechtii'' 作为新物种的种加词使用'
  D: '学名中原命名人Mayr 姓氏外的括号表明，Pilger 对Mayr 最初描述的分类单元的分类地位或名称组合进行

    了修订'
