stem: '碳酸氢盐缓冲系统 (CO2 + H2O <=> H2CO3 <=> H+ + HCO3–) 是维持血液pH 稳定的关键机制，其中碳酸酐酶

  催化第一步反应。在一个模拟血液缓冲环境的体外实验体系中，对以下关于改变条件对该系统pH 影响的陈述进

  行正误判断：'
options:
  A: 提高体系中溶解的CO2 浓度，将导致碳酸浓度增加，进而使氢离子浓度升高
  B: 加入碳酸酐酶抑制剂会显著改变该缓冲体系的最终平衡pH 值
  C: 降低体系中溶解的CO2全浓度，将导致碳酸氢根离子浓度显著下降，从而使pH 降低
  D: 降低体系中溶解的CO2 浓度，将导致反应平衡向左移动，氢离子浓度降低，pH 升高
