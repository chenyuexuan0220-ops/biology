source_question_no: 27
question_type: COMPREHENSIVE
stem: '土壤中可溶性盐类（如Na+、Cl-等）含量过高时会对植物生长和发育造

  成严重危害。植物中转运钠离子的转运蛋白在维持离子稳态和耐盐性中起

  关键作用。如右图中所示，HKT2 是HKT（High-Affinity K+ Transporter）家

  族的一个亚型，参与K+和Na+的转运。Nax1 和Nax2 转运蛋白是植物中一

  类重要的钠离子转运蛋白，主要存在于某些植物（如小麦）中。盐胁迫条件

  下，当Nax1 和Nax2 转运蛋白水平或活性增高时，请对以下实验结果的描

  述进行正误判断：'
options:
  A: 运到叶片的钠离子的量减少
  B: 从根到地上部的钠离子长距离运输效率下降
  C: 钠离子在根系中积累的量减少
  D: 钠离子在木质部周围的细胞中积累的量减少
