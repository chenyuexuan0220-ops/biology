source_question_no: 9
question_type: SINGLE_CHOICE
stem: 两位同学观察同一批叶片得出不同的平均长度。首先应核查什么？
options:
  A: 谁的成绩更好
  B: 测量位置、单位与取样方式是否一致
  C: 叶片是否认识观察者
  D: 只保留较大的结果
answer:
- B
explanation: 测量定义、单位和取样规则会影响结果，应先核对方法，再评估真实差异。
