    误地向内陆城市方向爬行，最终因脱水或被车辆碾压而死亡'
  B: "森林砍伐直接导致鸟类栖息地丧失，使得依赖森林的鸟类种群数量急剧下降，甚至局部灭绝\n\n                               \
