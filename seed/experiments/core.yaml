- code: EXP-001
  title: 显微镜观察
  description: 观察提供的洋葱表皮切片
  safety: 使用预制切片；玻璃载片由教师处理
  steps:
  - 调节光源与低倍镜
  - 观察并绘制细胞轮廓
  - 记录放大倍数并标注可辨认结构
- code: EXP-002
  title: 植物蒸腾作用
  description: 比较有叶与少叶枝条的失水
  safety: 使用安全塑料容器，剪枝由成人完成
  steps:
  - 准备同种枝条并记录叶片数量
  - 保持水面覆盖和环境一致
  - 记录容器质量变化并比较
- code: EXP-003
  title: 光合作用
  description: 分析教师提供的光照与产氧数据
  safety: 使用已有数据，不独立进行酒精加热
  steps:
  - 记录光照条件和测量单位
  - 绘制产氧量变化图
  - 区分光合与净产氧
- code: EXP-004
  title: 呼吸作用
  description: 观察萌发种子的温度变化
  safety: 不密封大型容器，不食用实验材料
  steps:
  - 准备等量萌发种子与对照
  - 记录初始与后续温度
  - 分析保温和环境温度影响
- code: EXP-005
  title: 渗透
  description: 比较不同盐水中植物组织的变化
  safety: 切割由成人完成，不食用实验材料
  steps:
  - 准备相同大小的植物组织
  - 分别放入清水和盐水并记录质量
  - 比较质量变化，解释水分移动
- code: EXP-006
  title: 酶活性
  description: 分析温度影响酶活性的数据
  safety: 仅使用提供的实验数据
  steps:
  - 确认自变量与因变量
  - 绘制温度与反应速率曲线
  - 讨论高温对结构的影响
- code: EXP-007
  title: 种子萌发
  description: 观察水分与萌发率
  safety: 避免霉变，戴手套丢弃实验材料
  steps:
  - 设置相同种子数量和温度
  - 控制水分条件并每日记录
  - 计算萌发比例与误差
- code: EXP-008
  title: 根向地性
  description: 观察根生长方向
  safety: 使用透明塑料盒，不食用萌发材料
  steps:
  - 记录初始根方向
  - 改变种子朝向并保持其他条件
  - 绘制根方向随时间变化
- code: EXP-009
  title: 向光性
  description: 观察幼苗对单侧光的生长响应
  safety: 不使用强激光或过热光源
  steps:
  - 设置单侧光与均匀光条件
  - 每天同一时段拍照记录
  - 比较弯曲方向与生长量
- code: EXP-010
  title: 叶片结构
  description: 观察不同环境叶片形态
  safety: 不采集未知或有毒植物
  steps:
  - 选取已知安全叶片
  - 比较叶缘、叶脉与厚度
  - 区分直接观察和适应性解释
- code: EXP-011
  title: 生态调查
  description: 记录校园生物与环境因素
  safety: 成人陪同，不触碰野生动物
  steps:
  - 划定安全调查范围
  - 记录物种与光照等环境因素
  - 说明取样局限
- code: EXP-012
  title: 群落调查
  description: 用样方记录植物组成
  safety: 避免破坏植被
  steps:
  - 明确样方位置选择方法
  - 记录各样方的种类和数量
  - 比较样方差异
- code: EXP-013
  title: 种群统计
  description: 利用模拟数据估计种群数量
  safety: 使用纸面数据
  steps:
  - 记录初次标记数与重捕数
  - 计算标记重捕估计值
  - 讨论封闭种群等假设
- code: EXP-014
  title: 微生物基础
  description: 观察教师提供的微生物图像
  safety: 不培养未知环境微生物，不打开培养皿
  steps:
  - 辨认提供图像的尺度
  - 比较细菌与真核细胞
  - 讨论灭菌与无菌操作
- code: EXP-015
  title: 实验数据分析
  description: 评价一组对照实验数据
  safety: 使用已知来源的数据，不编造观察
  steps:
  - 核对变量、单位与样本量
  - 计算均值并保留重复数据
  - 提出结论、局限和改进
