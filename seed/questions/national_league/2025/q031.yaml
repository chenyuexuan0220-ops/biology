  raw_text: "低浓度生长素（Auxin）促进拟南芥下胚轴伸长，高浓度则抑制其伸长；光照通常抑制拟南芥下胚轴生长，黑\n暗则促进其伸长。研究人员发现，较多的生长素会诱导产生更多的与生长素上升相关的小RNA\
    \ 转录本（即SAUR\n转录本），导致质膜 H⁺–ATPases 的活性增强，使拟南芥下胚轴表皮细胞质外体逐步酸化；然而，光照对质外体\npH 的净效应可能更复杂，并与其他信号途径相互作用。当pH\
    \ 高于某一阈值时，则促进生长，而低于该阈值时则\n抑制伸长，表明在拟南芥下胚轴生长中生长素和光的平衡是关键。基于以上内容，对以下陈述进行正误判断：\n A.\
    \ 若将拟南芥从黑暗转入光照下生长，同时给予一定量生长素处理，可能会部分缓解过量生长素对下胚轴伸长\n的抑制作用\n B. 在生长素剂量较低时，SAURs\
    \ 转录本的产生量较少，质膜 H⁺–ATPases 活性较弱，拟南芥下胚轴细胞伸长\n速度一定比高剂量的生长素处理时慢\n C. 黑暗中生长的拟南芥，若给予适量生长素处理，其质外体\
    \ pH 会下降，当 pH 低于促进生长的阈值时，即\n使再增加生长素剂量，下胚轴伸长也不会加快，反而可能减慢\n D. 生长在光照下生长的拟南芥，用H⁺–ATPases\
    \ 的抑制剂处理后，再施加适当浓度的生长素，拟南芥下胚轴正\n常伸长"
