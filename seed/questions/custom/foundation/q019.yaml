source_question_no: 19
question_type: SINGLE_CHOICE
stem: 假设基因 X 促进耐盐性，哪组证据最能加强因果推断？
options:
  A: 只有表达量与耐盐性相关
  B: 只观察一株正常植物
  C: 敲除降低耐盐性，回补恢复，且有适当对照
  D: 只比较两个不同物种
answer:
- C
explanation: 敲除与回补结合适当对照能较强地支持基因功能，而单纯相关不能排除混杂。
