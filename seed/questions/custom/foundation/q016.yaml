source_question_no: 16
question_type: SINGLE_CHOICE
stem: 升温能加快某酶促反应，但温度过高后速率降低，合理解释是什么？
options:
  A: 酶不再属于蛋白质
  B: 温度不会影响结构
  C: 高温可能破坏维持酶活性的空间结构
  D: 反应物必然全部消失
answer:
- C
explanation: 适度升温可增加分子运动；过高温度可能导致酶变性，降低催化能力。
