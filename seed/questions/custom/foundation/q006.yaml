source_question_no: 6
question_type: SINGLE_CHOICE
stem: 生态研究中，一只生活在池塘边的青蛙属于哪个层次？
options:
  A: 种群
  B: 群落
  C: 生态系统
  D: 个体
answer:
- D
explanation: 一只青蛙是个体；同一区域同种生物的所有个体构成种群。
