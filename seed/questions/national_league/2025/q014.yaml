source_question_no: 14
question_type: COMPREHENSIVE
stem: '鞘磷脂是哺乳动物中含量最丰富的

  鞘脂，对于细胞的生长和存活至关重要。

  鞘磷脂由神经酰胺和磷脂酰胆碱的磷酸

  胆碱头部基团合成得到，被水解后会产生全

  神经酰胺。研究人员发现了一个与鞘磷脂

  合成或水解相关的代谢酶，在对照和表达

  该酶的细胞中分别检测了鞘磷脂（A 图）

  和神经酰胺（B 图）的含量，并在不同条

  件下对其生化活性进行了分析（C 图，其

  中EDTA 为金属离子螯合剂；GSH 为还

  原型谷胱甘肽），请对以下陈述进行正误判断：'
options:
  A: 该酶为鞘磷脂水解酶
  B: 该酶在中性条件下活性高于酸性或碱性条件
  C: 该酶的活性不依赖金属离子
  D: 该酶的活性依赖二硫键的形成
