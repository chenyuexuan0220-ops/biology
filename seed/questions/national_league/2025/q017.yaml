question_type: COMPREHENSIVE
stem: 'PI 染料在与DNA 结合后可被激发产生荧光，荧光强度

  与DNA 含量成正比。利用该性质，可将PI 染色的细胞通

  过流式细胞仪，检测每个细胞中的荧光量。具有特定DNA

  含量的野生型细胞和突变细胞，在没有射线照射和γ 射线

  照射条件下处于不同周期进程的细胞数量分别绘制在右图

  中。请根据图中的数据，对以下描述进行正误判断：'
options:
  A: S 期细胞中DNA 含量介于2n 和4n 之间
  B: 'γ 射线照射后，突变细胞中处于S 期的细胞比例下降，

    而野生型细胞中处于S 期的细胞比例上升'
  C: 'γ 射线照射后，与野生型细胞相比，突变细胞处于G1

    期的细胞数相比野生型显著减少'
  D: 'γ 射线照射使大多数突变细胞处于G2 期，其从G2 向

    M 期和G1 的细胞周期进程被阻断'
