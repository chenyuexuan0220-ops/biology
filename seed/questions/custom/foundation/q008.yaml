source_question_no: 8
question_type: SINGLE_CHOICE
stem: 酶通常通过哪种作用促进生物化学反应？
options:
  A: 改变反应的最终平衡
  B: 永久提供反应所需能量
  C: 降低反应的活化能
  D: 被大量消耗成为产物
answer:
- C
explanation: 酶降低反应活化能，加快达到平衡的速度，但不改变平衡位置。
