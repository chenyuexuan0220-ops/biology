question_type: COMPREHENSIVE
stem: 'Stickler 综合征I 型是由12 号染色体上COL2A1 基因突变引起的遗传病。一个受该病影响的家庭希望通过分

  子生物学方法进行检测。对以下关于可用于研究COL2A1 基因及其表达产物的分子遗传学检测技术的陈述进行

  正误判断：'
options:
  A: 'Western 印迹法可以通过检测COL2A1 蛋白量的变化来协助推断启动子功能是否异常，但不能确定启动子

    DNA 的具体序列改变'
  B: 'Southern 印迹法检测启动子区域DNA 变异的能力依赖于突变是否改变了限制性内切酶识别位点或导致了较

    大的结构变化'
  C: '定量RT-PCR 技术可用于测量COL2A1 mRNA 的丰度，从而评估mRNA 序列不变时启动子突变对基因转录

    活性的影响，但不能直接鉴定DNA 序列突变'
  D: '利用COL2A1 基因探针进行荧光原位杂交(FISH)，可以通过分析杂交信号强度的细微变化来直接识别启动

    子区域具体的DNA 序列突变类型'
