[project]
name = "biology-ai-learning"
version = "1.2.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.5,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "httpx>=0.27,<1", "pyyaml>=6,<7", "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2", "python-docx>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pypdf>=5,<7", "pymupdf>=1.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
