question_type: COMPREHENSIVE
stem: "对以下关于哺乳类动物细胞静息膜电位的计算的陈述进行正误判断：\n         离子  细胞内浓度 (mM) 细胞外浓度 (mM)  静息膜通透性\
  \                  K+全140                 4             100%\n                 \
  \ Na+            15                145            5%\n                         Cl-\
  \            4                 110            10%\n                    Ca2+    \
  \      0.0001                5                 0"
options:
  A: 钾离子（K+）对静息膜电位的贡献最大，因为它的通透性最高
  B: 钠离子（Na+）的细胞外浓度远高于细胞内浓度，但其对静息膜电位的贡献较小，因为它的通透性较低
  C: 根据给定的离子浓度和通透性，计算得到的静息膜电位约为 -90 mV
  D: 钙离子（Ca2+）对静息膜电位没有贡献，因为它的通透性为零
