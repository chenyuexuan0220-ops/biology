stem: '恐惧是为了应对感知

  到的危险或威胁而出现的

  一种心理状态，通常基于逃

  避和回避等行为进行量化。

  为探究非营养级种间互动

  的恐惧反应，研究人员使用

  自动行为反应(ABR)系统， 国测试非洲稀树草原有蹄类

  动物对不同声音（豹、大象

  尖锐声音、大象低沉声音、

  大象混合声音、对照组红胸

  杜鹃）的行为响应。图示显

  示了逃跑概率和警戒比例的平均值及其变异。根据所给信息，请对以下陈述进行正误判断：'
options:
  A: 根据图可知，相较于对照组，巨型动物非洲草原象的声音会引发有蹄类食草动物显著的恐惧反应
  B: 研究中涉及到的有蹄类动物的逃跑和警戒行为实际上属于动物行为分类中的反捕食/防御行为
  C: '有蹄类动物对大象声音的恐惧可能源于新奇刺激或体型因素，且这种反应完全依赖于个体学习而非遗传基

    础全'
  D: '大象的攻击行为可能与特定鸣叫声相关联，从而驱动有蹄类动物产生恐惧反应，这种机制是基于生态互作的

    演化适应'
