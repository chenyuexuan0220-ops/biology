stem: '动物通常依靠环境线索来做出行为和生活史上的决定，以维持自身较高的适合度。然而，在被人类突然改变

  的环境中，以前可靠的线索可能不再能维持较高的适合度。当动物根据以前与栖息地质量相关的可靠线索在新的

