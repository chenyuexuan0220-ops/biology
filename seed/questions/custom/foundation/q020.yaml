question_type: SINGLE_CHOICE
stem: 处理组每小时产气 12 mL，对照组 8 mL，相对于对照的增加百分比是多少？
options:
  A: 4%
  B: 33.3%
  C: 50%
  D: 150%
answer:
- C
explanation: 相对增加为 (12-8)/8×100%=50%，分母应为对照值。
