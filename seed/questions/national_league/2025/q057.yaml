source_question_no: 57
question_type: COMPREHENSIVE
stem: '为研究黑腹果蝇基因A 的功能，研究者利用P

  元件转座，将一个包含GAL4 基因、GFP 报告基因及

  FRT 位点的突变元件插入到基因A 的外显子2 中（结

  构如图所示，图例Poly A 即多聚腺苷酸化信号）。该

  策略旨在结合UAS-GAL4 和FRT-FLP 系统进行后续

  分析。对以下关于该基因修饰及其应用的陈述进行正

  误判断：'
options:
  A: '该突变元件插入外显子2 的主要影响是直接阻

    断基因A 启动子的转录起始活性 国'
  B: 该元件中包含的GFP 基因可作为分子标记，用于初步筛选携带此插入突变的果蝇个体
  C: 若与表达FLP 重组酶的果蝇品系杂交，可在子代特定细胞中通过FRT 位点介导的重组移除GFP 基因
  D: 该设计通过将GFP 序列插入外显子2，能够稳定表达基因A 蛋白与GFP 蛋白的融合蛋白
