source_question_no: 2
question_type: SINGLE_CHOICE
stem: 下列关于细胞的描述，哪一项正确？
options:
  A: 所有生物都只有一个细胞
  B: 细胞是多数生物结构和功能的基本单位
  C: 只有动物具有细胞
  D: 细胞内部没有结构分工
answer:
- B
explanation: 除病毒等非细胞生命形式外，细胞是生物结构和功能的基本单位。
