stem: '植物细胞壁作为包裹在原生质体外围的特殊结构，其结构和成分是植物学研究的重点。Lamport 和Epsteirn 提

  出的“经纬模型”是描述初生细胞壁结构的模型之一。请对下面关于该模型的陈述进行正误判断：'
options:
  A: 纤维素微纤丝作为“经线”，构成细胞壁的主要骨架
  B: 半纤维素作为“纬线”，垂直于纤维素微纤丝排列，并通过氢键与之连接
  C: 果胶填充在纤维素和半纤维素网络中，其状态变化可以影响细胞壁的柔韧性或硬度
