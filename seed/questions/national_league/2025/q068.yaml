  化中的后果，判断以下陈述的正确性：'
options:
  A: 不等交换可导致某些基因家族成员减少
  B: 不等交换是基因家族扩大的潜在机制
  C: 不等交换通常发生在减数分裂中，但也有可能在有丝分裂中出现
  D: 不等交换可能促进新基因功能的演化
