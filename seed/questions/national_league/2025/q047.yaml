  种组织之间糖原合成调节机制的适用性，请对以下陈述进行正误判断： 国'
options:
  A: '利用13C–葡萄糖进行稳定同位素示踪，以量化组织特异性糖原合成速率，可以直接测量肝脏和肌肉中不同

