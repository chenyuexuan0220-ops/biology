stem: '细胞在饥饿条件下会产生自噬小体包裹自身的部分物质用于分解提供能量。在酿酒酵母中，自噬小体在细胞

  质中产生后被运输到液泡进行分解（见右

  侧A 图），野生型细胞中这一分解过程会

  较快完成，然而一些突变体会产生B 图

  所示表型，请对以下陈述进行正误判断：'
options:
  A: '该突变体是由于自噬小体形成过程

    出现障碍而导致'
  B: '该突变体是由于自噬小体不能和液

    泡融合而导致'
  C: '该突变体是由于液泡分解功能障碍

    而导致'
  D: 使用蛋白酶抑制剂处理野生型酵母细胞可能会得到类似的表型
