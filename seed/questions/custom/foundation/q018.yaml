stem: 抑制线粒体 ATP 合成后，某细胞的主动运输下降。哪项对机制的推断最严谨？
options:
  A: 所有跨膜运输都依赖线粒体
  B: 结果支持该运输与能量供给有关，还需排除毒性等影响
  C: 线粒体直接把所有物质运出细胞
  D: 该结果证明细胞膜完全破裂
answer:
- B
explanation: 干预后运输下降支持能量依赖的可能，但需控制细胞活性与其他效应才能加强因果证据。
