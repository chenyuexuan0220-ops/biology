source_question_no: 7
question_type: COMPREHENSIVE
stem: 'mRNA 疫苗递送常使用脂质纳米颗粒（LNP），其通常包含可电离阳离子脂质、胆固醇、辅助磷脂和聚乙二醇

  （PEG）修饰脂质。LNP 能保护mRNA，促进其进入细胞，并且其pH 敏感特性对于mRNA 从被细胞吞入形成

  的囊泡中释放到细胞质内这一关键步骤至关重要。对以下关于LNP 结构与功能的陈述进行正误判断：'
options:
  A: LNP 中的可电离阳离子脂质在生理血液pH（约7.4）条件下带有显著正电荷，用于结合mRNA
  B: PEG 修饰的脂质分布在LNP 表面，形成亲水层，有助于延长LNP 在血液中的循环时间
  C: LNP 进入细胞后，主要依靠胆固醇组分直接破坏内体膜结构，从而释放mRNA 至细胞质
  D: '若将LNP 中的辅助磷脂替换为分子链更饱和、刚性更强的脂质，可能会因降低膜的柔韧性而影响mRNA 递

    送效率'
