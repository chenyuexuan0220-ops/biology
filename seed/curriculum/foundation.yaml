code: foundation_template_v1
title: 生物学核心知识与竞赛桥接模板
template_weeks: 48
units:
- sequence: 1
  title: 科学观察
  content: '-   D1：生命现象与生物学观察；记录10条直接事实。

    -   D2：分类标准；将10种对象按两种标准分类。

    -   D3：叶片观察；记录形状、颜色、叶脉、边缘、厚度。

    -   D4：事实/解释判断题10题。

    -   D5：10题+观察题；知识≥85%、观察≥80%。'
  knowledge_points:
  - BIO.SCIENCE.001
  - BIO.SCIENCE.002
  - BIO.PLANT.005
  - BIO.EXP.010
- sequence: 2
  title: 假设与证据
  content: '-   D1：假设与问题。

    -   D2：证据与结论。

    -   D3：观察"光照与植物生长"。

    -   D4：判断结论是否被数据支持。

    -   D5：周测；能提出可检验假设。'
  knowledge_points:
  - BIO.SCIENCE.005
  - BIO.SCIENCE.014
  - BIO.SCIENCE.015
  - BIO.EXP.010
  - BIO.BRIDGE.303
  - BIO.BRIDGE.304
- sequence: 3
  title: 实验变量
  content: '-   D1：自变量/因变量。

    -   D2：控制变量/对照组。

    -   D3：设计豆苗光照实验。

    -   D4：寻找实验设计错误。

    -   D5：周测；变量识别≥90%。'
  knowledge_points:
  - BIO.SCIENCE.006
  - BIO.SCIENCE.007
  - BIO.SCIENCE.008
  - BIO.SCIENCE.009
  - BIO.SCIENCE.010
